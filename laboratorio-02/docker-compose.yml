services:
  db:
    image: mysql:8.0
    container_name: samplevault-db
    restart: unless-stopped
    env_file:
      - ./config/db/.env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/config/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    networks:
      - samplevault-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    image: node:18-alpine
    container_name: samplevault-backend
    restart: unless-stopped
    command: sh -c "npm install && npm run dev"
    working_dir: /app
    env_file:
      - ./config/db/.env
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - ./frontend:/frontend:ro
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - samplevault-network

networks:
  samplevault-network:
    driver: bridge

volumes:
  mysql_data:
