<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="914px" preserveAspectRatio="none" style="width:1370px;height:914px;background:#F0F8FF;" version="1.1" viewBox="0 0 1370 914" width="1370px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#F0F8FF" height="914" style="stroke:none;stroke-width:1;" width="1370" x="0" y="0"/><rect fill="#C0D8FF" height="101.0474" style="stroke:#000000;stroke-width:1.5;" width="1131.585" x="214.105" y="16"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="1111.585" x="224.105" y="31.1318">P1: Extract FileStorageAdapter&lt;BR&gt;- Local FS -&gt; adapter interface&lt;BR&gt;- Enable S3/Cloudinary swap&lt;BR&gt;- Duplicate fix: adminController&lt;BR&gt;- Effort: Medium&lt;BR&gt;Impact: High</text><path d="M460.8411,62.0986 L460.8411,87.0474 L1098.9539,87.0474 L1098.9539,72.0986 L1088.9539,62.0986 L460.8411,62.0986" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1088.9539,62.0986 L1088.9539,72.0986 L1098.9539,72.0986 L1088.9539,62.0986" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="617.1128" x="466.8411" y="79.2925">sampleController uses adapter&lt;BR&gt;adminController uses same adapter&lt;BR&gt;Reduces file logic duplication</text><rect fill="#D8F0C0" height="101.0474" style="stroke:#000000;stroke-width:1.5;" width="1054.3867" x="104.5593" y="127.0474"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="1034.3867" x="114.5593" y="142.1792">P2: Parameterize role in authController.register()&lt;BR&gt;- register(req, res, role = 'producer')&lt;BR&gt;- Increases caller leverage&lt;BR&gt;- Effort: Low&lt;BR&gt;Impact: Low-Medium</text><path d="M460.8411,173.146 L460.8411,198.0947 L802.6643,198.0947 L802.6643,183.146 L792.6643,173.146 L460.8411,173.146" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M792.6643,173.146 L792.6643,183.146 L802.6643,183.146 L792.6643,173.146" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320.8232" x="466.8411" y="190.3398">Callers pass role explicitly&lt;BR&gt;No need to fork function</text><rect fill="#FFF0C0" height="101.0474" style="stroke:#000000;stroke-width:1.5;" width="1302.3535" x="47.9373" y="238.0947"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="1282.3535" x="57.9373" y="253.2266">P3: Add business-facing methods to sampleRepo&lt;BR&gt;- countByCategory(category)&lt;BR&gt;- exists(id, userId)&lt;BR&gt;- getRecentSamples(days)&lt;BR&gt;- Hide SP complexity&lt;BR&gt;- Effort: Low&lt;BR&gt;Impact: Medium</text><path d="M460.8411,284.1934 L460.8411,309.1421 L937.387,309.1421 L937.387,294.1934 L927.387,284.1934 L460.8411,284.1934" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M927.387,284.1934 L927.387,294.1934 L937.387,294.1934 L927.387,284.1934" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="455.5459" x="466.8411" y="301.3872">Callers use simpler interface&lt;BR&gt;Don't need to understand SP return structure</text><rect fill="#FFD8C0" height="101.0474" style="stroke:#000000;stroke-width:1.5;" width="1281.3535" x="16" y="349.1421"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="1261.3535" x="26" y="364.2739">P4: Split apiService into specific methods&lt;BR&gt;- apiGet(), apiPost(), apiUpload()&lt;BR&gt;- Or comprehensive JSDoc&lt;BR&gt;- Evaluate based on frontend growth&lt;BR&gt;- Effort: Low-Medium&lt;BR&gt;Impact: Medium</text><path d="M460.8411,395.2407 L460.8411,420.1895 L852.5125,420.1895 L852.5125,405.2407 L842.5125,395.2407 L460.8411,395.2407" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M842.5125,395.2407 L842.5125,405.2407 L852.5125,405.2407 L842.5125,395.2407" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="370.6714" x="466.8411" y="412.4346">If frontend grows, split methods&lt;BR&gt;If staying small, add JSDoc</text><rect fill="#D8C0FF" height="101.0474" style="stroke:#000000;stroke-width:1.5;" width="1054.8994" x="150.9297" y="460.1895"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="1034.8994" x="160.9297" y="475.3213">P5: Extract UserDeletionValidator&lt;BR&gt;- canDelete(adminId, targetUserId)&lt;BR&gt;- Separate business rule from orchestration&lt;BR&gt;- Effort: Medium&lt;BR&gt;Impact: Medium</text><path d="M460.8411,506.2881 L460.8411,531.2368 L895.9177,531.2368 L895.9177,516.2881 L885.9177,506.2881 L460.8411,506.2881" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M885.9177,506.2881 L885.9177,516.2881 L895.9177,516.2881 L885.9177,506.2881" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="414.0767" x="466.8411" y="523.4819">Rule testable in isolation&lt;BR&gt;Keeps controller focused on orchestration</text><rect fill="#F5C0C0" height="101.0474" style="stroke:#000000;stroke-width:1.5;" width="1155.292" x="87.7144" y="571.2368"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="1135.292" x="97.7144" y="586.3687">P6: Extract table renderers into adapter components&lt;BR&gt;- UsersTableRenderer, SamplesTableRenderer&lt;BR&gt;- Localize DOM details&lt;BR&gt;- Effort: Medium-High&lt;BR&gt;Impact: Medium</text><path d="M460.8411,617.3354 L460.8411,642.2842 L869.8796,642.2842 L869.8796,627.3354 L859.8796,617.3354 L460.8411,617.3354" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M859.8796,617.3354 L859.8796,627.3354 L869.8796,627.3354 L859.8796,617.3354" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.0386" x="466.8411" y="634.5293">Front controllers depend on&lt;BR&gt;renderer interface, not inline DOM</text><rect fill="#FFF5B0" height="101.0474" style="stroke:#000000;stroke-width:1.5;" width="1016.7822" x="134.2161" y="682.2842"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="996.7822" x="144.2161" y="697.416">P7: Extract form validation into dedicated modules&lt;BR&gt;- AuthFormValidator&lt;BR&gt;- validateLogin(), validateRegister()&lt;BR&gt;- Effort: Medium&lt;BR&gt;Impact: Medium</text><path d="M460.8411,728.3828 L460.8411,753.3315 L824.3733,753.3315 L824.3733,738.3828 L814.3733,728.3828 L460.8411,728.3828" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M814.3733,728.3828 L814.3733,738.3828 L824.3733,738.3828 L814.3733,728.3828" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.5322" x="466.8411" y="745.5767">Reduces duplication in&lt;BR&gt;front controllers event handlers</text><rect fill="#E0E0E0" height="101.0474" style="stroke:#000000;stroke-width:1.5;" width="1011.4434" x="115.2178" y="793.3315"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="991.4434" x="125.2178" y="808.4634">P8: Extract AudioPlayerAdapter&lt;BR&gt;- Configurable baseURL&lt;BR&gt;- Replace hardcoded http://localhost:3000{path}&lt;BR&gt;- Effort: Low&lt;BR&gt;Impact: Low-Medium</text><path d="M460.8411,839.4302 L460.8411,864.3789 L781.0378,864.3789 L781.0378,849.4302 L771.0378,839.4302 L460.8411,839.4302" fill="#FEFFDD" style="stroke:#181818;stroke-w