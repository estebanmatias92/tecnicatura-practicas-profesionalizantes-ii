<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1473px;height:769px;background:#FFFFFF;" width="1473px" height="769px" viewBox="0 0 1473 769" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="4"><text x="87.077" y="37.118" fill="#000" font-size="22" textLength="1296.958" font-weight="700" font-family="Verdana">ER — BiblioTech (MariaDB 11, RST-003) — relación normalizada salvo `tags` JSON (tradeoff, ADR-0005)</text></g><!--class users--><g class="entity" data-qualified-name="users" id="ent0001" data-source-line="6"><rect x="829.64" y="59.737" width="413.696" height="146.088" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="2.5" ry="2.5"/><ellipse cx="1013.857" cy="73.737" rx="9" ry="9" fill="#FFF" style="stroke:#000;stroke-width:1;"/><path d="M1010.357,80.237 L1010.357,67.831 L1017.795,67.831 L1017.795,69.69 L1012.451,69.69 L1012.451,72.925 L1017.201,72.925 L1017.201,74.722 L1012.451,74.722 L1012.451,78.362 L1017.795,78.362 L1017.795,80.237 L1010.357,80.237 Z " fill="#000"/><text x="1031.357" y="79.305" fill="#000" font-size="14" textLength="37.762" font-family="Verdana">users</text><line x1="830.64" y1="87.737" x2="1242.336" y2="87.737" style="stroke:#000;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="840.64" cy="101.745" rx="3" ry="3" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><text x="847.64" y="105.813" fill="#000" font-size="14" textLength="131.072" font-family="Verdana">id : INT PK «auto»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="840.64" cy="118.759" rx="3" ry="3" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><text x="847.64" y="122.827" fill="#000" font-size="14" textLength="389.696" font-family="Verdana">token_version : INT DEFAULT 0 «NFR-006, ADR-0004»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="840.64" cy="135.774" rx="3" ry="3" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><text x="847.64" y="139.842" fill="#000" font-size="14" textLength="164.63" font-family="Verdana">created_at : DATETIME</text><line x1="830.64" y1="146.781" x2="1242.336" y2="146.781" style="stroke:#000;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="840.64" cy="160.789" rx="3" ry="3" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><text x="847.64" y="164.856" fill="#000" font-size="14" textLength="223.795" font-family="Verdana">email : VARCHAR(255) UNIQUE</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="840.64" cy="177.803" rx="3" ry="3" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><text x="847.64" y="181.871" fill="#000" font-size="14" textLength="232.784" font-family="Verdana">password_hash : VARCHAR(255)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="840.64" cy="194.818" rx="3" ry="3" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><text x="847.64" y="198.886" fill="#000" font-size="14" textLength="294.916" font-family="Verdana">role : ENUM('Admin','Professor','Student')</text></g><!--class materials--><g class="entity" data-qualified-name="materials" id="ent0002" data-source-line="15"><rect x="12" y="265.827" width="726.967" height="265.19" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="2.5" ry="2.5"/><ellipse cx="339.112" cy="279.827" rx="9" ry="9" fill="#FFF" style="stroke:#000;stroke-width:1;"/><path d="M335.612,286.327 L335.612,273.921 L343.05,273.921 L343.05,275.78 L337.706,275.78 L337.706,279.015 L342.456,279.015 L342.456,280.812 L337.706,280.812 L337.706,284.452 L343.05,284.452 L343.05,286.327 L335.612,286.327 Z " fill="#000"/><text x="356.612" y="285.395" fill="#000" font-size="14" textLength="65.242" font-family="Verdana">materials</text><line x1="13" y1="293.827" x2="737.967" y2="293.827" style="stroke:#000;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="23" cy="307.835" rx="3" ry="3" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><text x="30" y="311.903" fill="#000" font-size="14" textLength="131.072" font-family="Verdana">id : INT PK «auto»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="23" cy="324.849" rx="3" ry="3" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><text x="30" y="328.917" fill="#000" font-size="14" textLength="195.063" font-family="Verdana">title : VARCHAR(200) «NN»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="23" cy="341.864" rx="3" ry="3" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><text x="30" y="345.932" fill="#000" font-size="14" textLength="214.122" font-family="Verdana">author : VARCHAR(120) «NN»</text><text x="30" y="362.946" fill="#000" font-size="14" textLength="228.676" font-family="Verdana">° subject : VARCHAR(120) NULL</text><text x="30" y="379.961" fill="#000" font-size="14" textLength="237.022" font-family="Verdana">° year : INT NULL «1000..actual»</text><text x="30" y="396.976" fill="#000" font-size="14" textLength="216.549" font-family="Verdana">° edition : VARCHAR(40) NULL</text><text x="30" y="413.99" fill="#000" font-size="14" textLength="280.451" font-family="Verdana">° tags : JSON NULL &lt;«=10, lowercase»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="23" cy="426.937" rx="3" ry="3" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><text x="30" y="431.005" fill="#000" font-size="14" textLength="430.172" font-family="Verdana">owner_id : INT FK -> users.id «ON DELETE CASCADE [C-2]»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="23" cy="443.952" rx="3" ry="3" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><text x="30" y="448.02" fill="#000" font-size="14" textLength="702.967" font-family="Verdana">blob_id : INT FK -> file_blobs.id UNIQUE «NO ACTION; cascada en transacción de app, ADR-0005»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="23" cy="460.966" rx="3" ry="3" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><text x="30" y="465.034" fill="#000" font-size="14" textLength="164.63" font-family="Verdana">created_at : DATETIME</text><line x1="13" y1="471.974" x2="737.967" y2="471.974" style="stroke:#000;stroke-width:1;"/><text x="18" y="490.049" fill="#000" font-size="14" textLength="655.279" font-family="Verdana">FULLTEXT (title, author, subject) «q token/prefijo UC-005, NFR-001 — NO infijo, ADR-0006»</text><text x="18" y="507.064" fill="#000" font-size="14" textLength="215.674" font-family="Verdana">INDEX (year) «rango UC-005»</text><text x="18" y="524.078" fill="#000" font-size="14" textLength="321.228" font-family="Verdana">INDEX (created_at) «orden más-reciente v1»</text></g><!--class file_blobs--><g class="entity" data-qualified-name="file_blobs" id="ent0003" data-source-line="32"><rect x="66.16" y="591.017" width="618.645" height="163.103" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="2.5" ry="2.5"/><ellipse cx="338.27" cy="605.017" rx="9" ry="9" fill="#FFF" style="stroke:#000;stroke-width:1;"/><path d="M334.77,611.517 L334.77,599.111 L342.208,599.111 L342.208,600.97 L336.864,600.97 L336.864,604.205 L341.614,604.205 L341.614,606.002 L336.864,606.002 L336.864,609.642 L342.208,609.642 L342.208,611.517 L334.77,611.517 Z " fill="#000"/><text x="355.77" y="610.585" fill="#000" font-size="14" textLength="66.924" font-family="Verdana">file_blobs</text><line x1="67.16" y1="619.017" x2="683.805" y2="619.017" style="stroke:#000;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="77.16" cy="633.025" rx="3" ry="3" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><text x="84.16" y="637.093" fill="#000" font-size="14" textLength="131.072" font-family="Verdana">id : INT PK «auto»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="77.16" cy="650.039" rx="3" ry="3" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><text x="84.16" y="654.107" fill="#000" font-size="14" textLength="271.168" font-family="Verdana">size_bytes : INT &lt;«=50MB, RST-005»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="77.16" cy="667.054" rx="3" ry="3" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><text x="84.16" y="671.122" fill="#000" font-size="14" textLength="164.63" font-family="Verdana">created_at : DATETIME</text><line x1="67.16" y1="678.061" x2="683.805" y2="678.061" style="stroke:#000;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="77.16" cy="692.069" rx="3" ry="3" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><text x="84.16" y="696.136" fill="#000" font-size="14" textLength="272.31" font-family="Verdana">storage_key : VARCHAR(255) UNIQUE</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="77.16" cy="709.083" rx="3" ry="3" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><text x="84.16" y="713.151" fill="#000" font-size="14" textLength="594.645" font-family="Verdana">file_name : VARCHAR(255) «NN, normalizado (basename, sin CRLF) v0.4.1/v0.5.0»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="77.16" cy="726.098" rx="3" ry="3" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><text x="84.16" y="730.166" fill="#000" font-size="14" textLength="257.25" font-family="Verdana">mime : VARCHAR(100) «PDF/EPUB»</text><text x="84.16" y="747.18" fill="#000" font-size="14" textLength="431.648" font-family="Verdana">° content_hash : CHAR(64) NULL «informativo, NO UNIQUE»</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="46"><path d="M773.55,306.527 L773.55,394.117 L739.1,398.117 L773.55,402.117 L773.55,490.32 A0,0 0 0 0 773.55,490.32 L1073.409,490.32 A0,0 0 0 0 1073.409,490.32 L1073.409,316.527 L1063.409,306.527 L773.55,306.527 A0,0 0 0 0 773.55,306.527" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M1063.409,306.527 L1063.409,316.527 L1073.409,316.527 L1063.409,306.527" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="779.55" y="324.597" fill="#000" font-size="13" textLength="246.213" font-family="Verdana">BR-004 v0.4.0: 1:1 Material:FileBlob,</text><text x="779.55" y="340.396" fill="#000" font-size="13" textLength="230.407" font-family="Verdana">nacen y mueren juntos; duplicados</text><text x="779.55" y="356.196" fill="#000" font-size="13" textLength="242.055" font-family="Verdana">permitidos (201), sin dedup (BR-007</text><text x="779.55" y="371.995" fill="#000" font-size="13" textLength="259.022" font-family="Verdana">eliminada); sin transfer (FR-014 elim.).</text><text x="779.55" y="387.794" fill="#000" font-size="13" font-family="Verdana"> </text><text x="779.55" y="403.594" fill="#000" font-size="13" textLength="277.532" font-family="Verdana">Cascada C-1/C-3 (material -> blob): la FK</text><text x="779.55" y="419.393" fill="#000" font-size="13" textLength="262.641" font-family="Verdana">NO usa ON DELETE CASCADE (dirección</text><text x="779.55" y="435.192" fill="#000" font-size="13" textLength="233.575" font-family="Verdana">blob->material invertiría el sentido,</text><text x="779.55" y="450.992" fill="#000" font-size="13" textLength="226.294" font-family="Verdana">BT-06 §3). Se enforza en un único</text><text x="779.55" y="466.791" fill="#000" font-size="13" textLength="278.859" font-family="Verdana">`deleteWithBlob` transaccional + limpieza</text><text x="779.55" y="482.59" fill="#000" font-size="13" textLength="104.368" font-family="Verdana">FS (ADR-0005).</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="59"><path d="M719.89,628.067 L719.89,668.117 L685.11,672.117 L719.89,676.117 L719.89,717.064 A0,0 0 0 0 719.89,717.064 L1021.076,717.064 A0,0 0 0 0 1021.076,717.064 L1021.076,638.067 L1011.076,628.067 L719.89,628.067 A0,0 0 0 0 719.89,628.067" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M1011.076,628.067 L1011.076,638.067 L1021.076,638.067 L1011.076,628.067" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="725.89" y="646.137" fill="#000" font-size="13" textLength="204.674" font-family="Verdana">Sin dueño propio, sin refCount,</text><text x="725.89" y="661.936" fill="#000" font-size="13" textLength="263.199" font-family="Verdana">sin compartir. contentHash NO gobierna</text><text x="725.89" y="677.736" fill="#000" font-size="13" textLength="280.186" font-family="Verdana">nada: sin UNIQUE, sin búsqueda por hash.</text><text x="725.89" y="693.535" fill="#000" font-size="13" textLength="272.657" font-family="Verdana">`file_name` es UX (Content-Disposition),</text><text x="725.89" y="709.334" fill="#000" font-size="13" textLength="221.14" font-family="Verdana">nunca clave de storage (BR-004).</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="66"><path d="M1108.85,353.917 L1108.85,442.914 A0,0 0 0 0 1108.85,442.914 L1458.113,442.914 A0,0 0 0 0 1458.113,442.914 L1458.113,363.917 L1448.113,353.917 L1180.09,353.917 L1176.09,206.067 L1172.09,353.917 L1108.85,353.917 A0,0 0 0 0 1108.85,353.917" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M1448.113,353.917 L1448.113,363.917 L1458.113,363.917 L1448.113,353.917" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="1114.85" y="371.987" fill="#000" font-size="13" textLength="328.263" font-family="Verdana">`token_version` (ADR-0004): el JWT lleva `ver`;</text><text x="1114.85" y="387.786" fill="#000" font-size="13" textLength="272.162" font-family="Verdana">el guard rechaza token con ver != actual.</text><text x="1114.85" y="403.586" fill="#000" font-size="13" textLength="303.862" font-family="Verdana">Cambio de rol / borrado de cuenta incrementa</text><text x="1114.85" y="419.385" fill="#000" font-size="13" textLength="313.53" font-family="Verdana">la versión -> revocación con ventana objetivo 0</text><text x="1114.85" y="435.184" fill="#000" font-size="13" textLength="122.123" font-family="Verdana">(NFR-006, BT-09).</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="73"><path d="M202.8,88.277 L202.8,177.274 A0,0 0 0 0 202.8,177.274 L371.48,177.274 L375.48,265.477 L379.48,177.274 L548.172,177.274 A0,0 0 0 0 548.172,177.274 L548.172,98.277 L538.172,88.277 L202.8,88.277 A0,0 0 0 0 202.8,88.277" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M538.172,88.277 L538.172,98.277 L548.172,98.277 L538.172,88.277" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="208.8" y="106.347" fill="#000" font-size="13" textLength="297.337" font-family="Verdana">Calificación normalización: `tags` JSON viola</text><text x="208.8" y="122.146" fill="#000" font-size="13" textLength="312.832" font-family="Verdana">1NF estricta; el resto del esquema está en 3NF.</text><text x="208.8" y="137.946" fill="#000" font-size="13" textLength="324.372" font-family="Verdana">Tradeoff de escala-lab documentado (join N:M de</text><text x="208.8" y="153.745" fill="#000" font-size="13" textLength="314.444" font-family="Verdana">tags rechazado, ADR-0003). AuthSession NO es</text><text x="208.8" y="169.544" fill="#000" font-size="13" textLength="285.752" font-family="Verdana">tabla: es un Value Object transitorio (JWT).</text></g><!--link users to materials--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="42" data-link-type="crowfoot"><path d="M821.38,191.117 C726.83,191.117 643.57,191.117 643.57,191.117 C643.57,191.117 643.57,206.997 643.57,247.377" style="stroke:#000;stroke-width:1;" fill="none" id="users-materials" codeLine="42"/><line x1="825.38" y1="187.117" x2="825.38" y2="195.117" style="stroke:#000;stroke-width:1;"/><line x1="822.38" y1="187.117" x2="822.38" y2="195.117" style="stroke:#000;stroke-width:1;"/><line x1="821.38" y1="191.117" x2="829.38" y2="191.117" style="stroke:#000;stroke-width:1;"/><line x1="643.57" y1="257.377" x2="649.57" y2="265.377" style="stroke:#000;stroke-width:1;"/><line x1="643.57" y1="257.377" x2="637.57" y2="265.377" style="stroke:#000;stroke-width:1