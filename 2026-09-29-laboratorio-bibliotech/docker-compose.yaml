# BiblioTech — MariaDB 11 (RST-003) + API + Web
# Uso: docker compose up --build  (db en 3306, api en 3000, web en 5173)
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-bibliotech}
      MARIADB_USER: ${DB_USER:-bibliotech}
      MARIADB_PASSWORD: ${DB_PASSWORD:-bibliotech}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - bibliotech-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-bibliotech}
      DB_USER: ${DB_USER:-bibliotech}
      DB_PASSWORD: ${DB_PASSWORD:-bibliotech}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      JWT_EXPIRES_H: "24"
      UPLOAD_DIR: /app/uploads
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - bibliotech-uploads:/app/uploads

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  bibliotech-db:
  bibliotech-uploads:
