# BiblioTech — override de desarrollo aislado (Node 22 + HMR).
# Uso via `make dev` (nunca directo en prod). Reutiliza `db` del compose base;
# `api`/`web` corren dev-servers con el codigo montado (sin rebuild por cambio).
# Requiere `.env` en la raiz (ver `make init`). El proxy /api de Vite apunta al
# servicio `api` via API_PROXY (default local: http://localhost:3000).
services:
  api:
    build:
      context: ./backend
      target: build
    command: ["npm", "run", "start:dev"]
    volumes:
      - ./backend/src:/app/src:ro

  web:
    build:
      context: ./frontend
      target: build
    command: ["npm", "run", "dev", "--", "--port", "5173"]
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      API_PROXY: http://api:3000
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
