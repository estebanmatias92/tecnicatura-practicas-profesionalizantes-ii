# BiblioTech API — OpenAPI 3.1 (contract-first, ooad-build paso 5)
# Fuente: UC-001..UC-006 + SRS v0.4.0. BR-002: todo exige JWT salvo register/login.
openapi: 3.1.0
info:
  title: BiblioTech API
  version: 0.1.0
  description: Biblioteca digital — roles Admin/Professor/Student, JWT + BCrypt, Multer, MariaDB.
servers:
  - url: http://localhost:3000
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      operationId: register
      security: []
      summary: UC-001 — auto-registro público, siempre Student (Admin fija rol vía POST /users)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                requestedRole: { type: string, enum: [Admin, Professor, Student] }
      responses:
        '201': { description: JWT sin password, content: { application/json: { schema: { $ref: '#/components/schemas/Token' } } } }
        '400': { description: Validator BR-003 }
        '409': { description: Email duplicado }
  /auth/login:
    post:
      operationId: login
      security: []
      summary: UC-001 — login emite JWT (BCrypt, expira <= 24h)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: JWT, content: { application/json: { schema: { $ref: '#/components/schemas/Token' } } } }
        '401': { description: Credencial incorrecta (sin distinguir) }
  /material:
    get:
      operationId: searchCatalog
      summary: UC-003/UC-005 — catalogo paginado con filtros AND
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: author, in: query, schema: { type: string } }
        - { name: subject, in: query, schema: { type: string } }
        - { name: year, in: query, schema: { type: integer } }
        - { name: yearFrom, in: query, schema: { type: integer } }
        - { name: yearTo, in: query, schema: { type: integer } }
        - { name: edition, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: array, items: { type: string } } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
      responses:
        '200': { description: Envelope items/total/page/limit, content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } } }
        '400': { description: page<1, limit>50, yearFrom>yearTo }
        '401': { description: Sin JWT }
    post:
      operationId: uploadMaterial
      summary: UC-002 — Professor/Admin sube PDF/EPUB <= 50MB + metadatos (duplicados -> 201)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title, author]
              properties:
                file: { type: string, format: binary }
                title: { type: string, minLength: 1, maxLength: 200 }
                author: { type: string, minLength: 1, maxLength: 120 }
                subject: { type: string, maxLength: 120 }
                year: { type: integer }
                edition: { type: string, maxLength: 40 }
                tags: { type: array, items: { type: string } }
      responses:
        '201': { description: Material creado, content: { application/json: { schema: { $ref: '#/components/schemas/Material' } } } }
        '400': { description: Metadatos invalidos }
        '401': { description: Sin JWT }
        '403': { description: Student }
        '413': { description: Supera 50MB }
        '415': { description: MIME no permitido }
  /material/{id}:
    get:
      operationId: getMaterial
      summary: UC-003 — leer metadatos (todo rol autenticado)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Material, content: { application/json: { schema: { $ref: '#/components/schemas/Material' } } } }
        '401': { description: Sin JWT }
        '404': { description: Inexistente }
    patch:
      operationId: updateMaterial
      summary: UC-004 — Professor edita el propio, Admin cualquiera
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                author: { type: string }
                subject: { type: string }
                year: { type: integer }
                edition: { type: string }
                tags: { type: array, items: { type: string } }
      responses:
        '200': { description: Material actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Material' } } } }
        '400': { description: Datos invalidos }
        '401': { description: Sin JWT }
        '403': { description: No dueno / no Admin }
        '404': { description: Inexistente }
    delete:
      operationId: deleteMaterial
      summary: UC-004 C-1/C-3 — borra material + su blob (204)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Borrado con cascada }
        '401': { description: Sin JWT }
        '403': { description: No dueno / no Admin }
        '404': { description: Inexistente }
  /material/{id}/file:
    get:
      operationId: downloadFile
      summary: UC-006 — bytes del original (401 primero aunque el id no exista)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Binario inline con Content-Type + filename }
        '401': { description: Sin JWT (primero) }
        '404': { description: Material inexistente }
  /users:
    post:
      operationId: createUser
      summary: UC-004 — Admin crea cuenta con rol (requestedRole requerido)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, requestedRole]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                requestedRole: { type: string, enum: [Admin, Professor, Student] }
      responses:
        '201': { description: JWT sin password, content: { application/json: { schema: { $ref: '#/components/schemas/Token' } } } }
        '400': { description: Validator BR-003 / requestedRole faltante }
        '401': { description: Sin JWT }
        '403': { description: No Admin }
        '409': { description: Email duplicado }
    get:
      operationId: listUsers
      summary: UC-004 — Admin lista usuarios
      responses:
        '200': { description: Lista sin passwordHash }
        '401': { description: Sin JWT }
        '403': { description: No Admin }
  /users/{id}:
    patch:
      operationId: changeRole
      summary: UC-004 — Admin cambia rol
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [Admin, Professor, Student] }
      responses:
        '200': { description: Rol actualizado }
        '401': { description: Sin JWT }
        '403': { description: No Admin }
        '404': { description: Inexistente }
    delete:
      operationId: deleteUser
      summary: UC-004 C-2 — Admin borra cuenta + materials + blobs en cascada
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Cascada completa }
        '401': { description: Sin JWT }
        '403': { description: No Admin }
        '404': { description: Inexistente }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Token:
      type: object
      required: [token]
      properties:
        token: { type: string }
        userId: { type: integer }
        role: { type: string, enum: [Admin, Professor, Student] }
    Material:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        author: { type: string }
        subject: { type: string }
        year: { type: integer }
        edition: { type: string }
        tags: { type: array, items: { type: string } }
        ownerId: { type: integer }
        blobId: { type: integer }
        createdAt: { type: string, format: date-time }
    Page:
      type: object
      required: [items, total, page, limit]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Material' } }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
