openapi: 3.0.3
info:
  title: BiblioTech API
  version: 1.0.0
  description: |
    Biblioteca digital con roles Admin, Professor y Student.
    Todo acceso a material exige JWT. El catálogo solo muestra material público.
    Los materiales ocultos responden 404 a quien no es propietario ni Admin.
servers:
  - url: /api
    description: Mismo origen (nginx en prod, proxy de Vite en dev)
tags:
  - name: Auth
  - name: Users
  - name: Materials
  - name: Health
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Estado del servicio y de la base de datos
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Base de datos no disponible
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Registro público (siempre Student)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login con email y contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [Auth]
      summary: Usuario autenticado actual
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users:
    get:
      tags: [Users]
      summary: Listar usuarios (Admin)
      responses:
        '200':
          description: Usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Crear usuario con rol (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInput'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/{id}/role:
    patch:
      tags: [Users]
      summary: Cambiar rol (Admin). Invalida las sesiones del usuario.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleInput'
      responses:
        '200':
          description: Rol actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
  /materials:
    get:
      tags: [Materials]
      summary: Catálogo público paginado
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Busca en título y autor
        - name: subject
          in: query
          schema: { type: string }
        - name: year
          in: query
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: Página de materiales públicos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Materials]
      summary: Crear borrador oculto (al menos un campo no vacío)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialInput'
      responses:
        '201':
          description: Borrador creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /materials/mine:
    get:
      tags: [Materials]
      summary: Materiales propios, incluyendo borradores y ocultos
      responses:
        '200':
          description: Materiales propios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'
        '403':
          $ref: '#/components/responses/Forbidden'
  /materials/admin:
    get:
      tags: [Materials]
      summary: Todos los materiales (Admin), con eliminados opcionales
      parameters:
        - name: includeDeleted
          in: query
          schema: { type: boolean, default: false }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Página de materiales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialPage'
        '403':
          $ref: '#/components/responses/Forbidden'
  /materials/{id}:
    get:
      tags: [Materials]
      summary: Detalle de material (oculto solo para propietario/Admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Material
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Materials]
      summary: Editar metadatos (propietario o Admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialInput'
      responses:
        '200':
          description: Material actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Materials]
      summary: Eliminar lógicamente (propietario o Admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Eliminado
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /materials/{id}/file:
    post:
      tags: [Materials]
      summary: Adjuntar o reemplazar archivo (propietario o Admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Archivo adjuntado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Archivo demasiado grande
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [Materials]
      summary: Ver archivo inline (visor)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Archivo
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/epub+zip:
              schema: { type: string, format: binary }
        '404':
          $ref: '#/components/responses/NotFound'
  /materials/{id}/download:
    get:
      tags: [Materials]
      summary: Descargar archivo como adjunto
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Archivo
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/epub+zip:
              schema: { type: string, format: binary }
        '404':
          $ref: '#/components/responses/NotFound'
  /materials/{id}/publish:
    post:
      tags: [Materials]
      summary: Publicar (exige título, autor y archivo)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Material público
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /materials/{id}/hide:
    post:
      tags: [Materials]
      summary: Ocultar (propietario o Admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Material oculto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /materials/{id}/restore:
    post:
      tags: [Materials]
      summary: Restaurar material eliminado (Admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Material restaurado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Sin permiso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicto
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Role:
      type: string
      enum: [ADMIN, PROFESSOR, STUDENT]
    Visibility:
      type: string
      enum: [OCULTO, PUBLICO]
    User:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string, format: date-time }
    FileInfo:
      type: object
      required: [id, originalName, mimeType, sizeBytes]
      properties:
        id: { type: string, format: uuid }
        originalName: { type: string }
        mimeType: { type: string, enum: [application/pdf, application/epub+zip] }
        sizeBytes: { type: integer }
    Material:
      type: object
      required: [id, ownerId, visibility, isDraft, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, nullable: true }
        author: { type: string, nullable: true }
        description: { type: string, nullable: true }
        subject: { type: string, nullable: true }
        year: { type: integer, nullable: true }
        ownerId: { type: string, format: uuid }
        ownerEmail: { type: string, nullable: true }
        visibility: { $ref: '#/components/schemas/Visibility' }
        isDraft: { type: boolean }
        publishedAt: { type: string, format: date-time, nullable: true }
        deletedAt: { type: string, format: date-time, nullable: true }
        file: { allOf: [{ $ref: '#/components/schemas/FileInfo' }], nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MaterialPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Material'
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
    AuthResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken: { type: string }
        user: { $ref: '#/components/schemas/User' }
    RegisterInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    CreateUserInput:
      type: object
      required: [email, password, role]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        role: { $ref: '#/components/schemas/Role' }
    UpdateRoleInput:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }
    MaterialInput:
      type: object
      properties:
        title: { type: string, maxLength: 255 }
        author: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 5000 }
        subject: { type: string, maxLength: 120 }
        year: { type: integer, minimum: 1000, maximum: 2100 }
    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode: { type: integer }
        message: { type: string }
        error: { type: string }
    Health:
      type: object
      required: [status, db]
      properties:
        status: { type: string, example: ok }
        db: { type: string, example: up }
